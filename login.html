
<!DOCTYPE html> <html lang="th"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Sheet Dek | เข้าสู่ระบบ</title> <style> /* ---------------------------------------------------- * 1. Global Reset & Basic Styling * ---------------------------------------------------- */ :root { --primary-color: #5e0606; --secondary-color: #696969; --white: #ffffff; --dark-red: #8B0000; --font-color: #333; } * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; } body { background-color: var(--white); line-height: 1.6; color: var(--font-color); } /* ---------------------------------------------------- * 2. Header & Footer * ---------------------------------------------------- */ .main-header { background-color: var(--primary-color); color: var(--white); display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; } .menu-icon { font-size: 24px; cursor: pointer; } .logo { font-size: 40px; font-weight: bold; text-align: center; flex-grow: 1; } .header-icons { display: flex; align-items: center; } .icon-link { color: var(--white); text-decoration: none; font-size: 20px; margin-right: 15px; } .profile-link { background-color: var(--white); color: var(--primary-color); padding: 5px 15px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: bold; transition: all 0.2s; } .profile-link:hover { background-color: var(--primary-color); color: var(--white); outline: 2px solid var(--white); } /* ---------------------------------------------------- * 3. Form Styling * ---------------------------------------------------- */ .form-container { max-width: 400px; margin: 50px auto; padding: 20px; text-align: center; } .form-container h1 { font-size: 1.8em; margin-bottom: 30px; font-weight: normal; } .registration-form { display: flex; flex-direction: column; align-items: center; } .registration-form label { align-self: flex-start; margin-bottom: 5px; font-size: 1em; font-weight: bold; color: var(--secondary-color); } .registration-form input[type="email"], .registration-form input[type="password"] { width: 100%; padding: 10px; margin-bottom: 25px; border: 1px solid var(--secondary-color); border-radius: 5px; font-size: 1em; text-align: center; } .btn-submit { background-color: var(--dark-red); color: var(--white); border: none; padding: 10px 40px; border-radius: 20px; font-size: 1em; font-weight: bold; cursor: pointer; margin-top: 20px; transition: background-color 0.2s; } .btn-submit:hover { background-color: #5e0606; } @media (max-width: 500px) { .form-container { margin: 30px 10px; } } </style> </head> <body> <header class="main-header"> <a href="index.html" class="icon-link">หน้าหลัก</a> <div class="logo">Sheet Dek</div> <div class="header-icons"> <a href="cart1.html" class="icon-link">ตะกร้าชีท🛒</a> </div> </header> <main class="form-container"> <h1>เข้าสู่ระบบ</h1> <form action="dashboard.html" method="POST" class="registration-form"> <label for="email">กรอกอีเมล</label> <input type="email" id="email" name="email" placeholder="email@example.com" required> <label for="password">รหัสผ่าน</label> <input type="password" id="password" name="password" placeholder="รหัสผ่านของคุณ" required> <button type="button" class="btn-submit" onclick="window.location.href='loginfinish.html'"> เข้าสู่ระบบ </button> <p style="margin-top: 20px; font-size: 0.9em;"> <a href="forgot-password.html" style="color: var(--secondary-color); text-decoration: none;"> ลืมรหัสผ่าน? </a> </p> <p style="font-size: 0.9em; margin-top: 5px;"> ยังไม่มีบัญชี? <a href="register.html" style="color: var(--dark-red); text-decoration: none; font-weight: bold;"> ลงทะเบียนที่นี่ </a> </p> </form>
<script type="module">
import { login } from "./auth.js";

document.querySelector(".btn-submit").addEventListener("click", () => {
    const email = document.getElementById("email").value;
    const pass  = document.getElementById("password").value;

    login(email, pass)
        .then(() => window.location.href = "loginfinish.html")
        .catch(() => alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง"));
});
</script>
