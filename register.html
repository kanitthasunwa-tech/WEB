<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheet Dek | ลงทะเบียน</title>

    <style>
/* ----------------------------------------------------
 * 1. Global Reset & Basic Styling
 * ---------------------------------------------------- */
:root {
    --primary-color: #5e0606;
    --secondary-color: #696969;
    --white: #ffffff;
    --dark-red: #8B0000;
    --font-color: #333;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background-color: var(--white);
    line-height: 1.6;
    color: var(--font-color);
}

/* ----------------------------------------------------
 * 2. Header
 * ---------------------------------------------------- */
.main-header {
    background-color: var(--primary-color);
    color: var(--white);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
}

.logo {
    font-size: 40px;
    font-weight: bold;
    flex-grow: 1;
    text-align: center;
}

.icon-link {
    color: var(--white);
    text-decoration: none;
    font-size: 20px;
    margin-right: 15px;
}

/* ----------------------------------------------------
 * 3. Form Styling
 * ---------------------------------------------------- */
.form-container {
    max-width: 400px;
    margin: 50px auto;
    padding: 20px;
    text-align: center;
}

.form-container h1 {
    font-size: 1.8em;
    margin-bottom: 30px;
    font-weight: normal;
}

.registration-form {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.registration-form label {
    align-self: flex-start;
    margin-bottom: 5px;
    font-size: 1em;
    font-weight: bold;
    color: var(--secondary-color);
}

.registration-form input[type="email"],
.registration-form input[type="password"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 25px;
    border: 1px solid var(--secondary-color);
    border-radius: 5px;
    font-size: 1em;
    text-align: center;
}

.btn-submit {
    background-color: var(--dark-red);
    color: var(--white);
    border: none;
    padding: 10px 40px;
    border-radius: 20px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
    transition: background-color 0.2s;
}

.btn-submit:hover {
    background-color: #5e0606;
}

@media (max-width: 500px) {
    .form-container {
        margin: 30px 10px;
    }
}
    </style>

</head>
<body>

<header class="main-header">
    <a href="index.html" class="icon-link">หน้าหลัก</a>
    <div class="logo">Sheet Dek</div>
    <a href="cart.html" class="icon-link">ตะกร้าชีท🛒</a>
</header>

<main class="form-container">
    <h1>ลงทะเบียน</h1>

    <form action="loginfinish.html" method="GET" class="registration-form">

        <label for="email">กรอกอีเมล</label>
        <input type="email" id="email" name="email" placeholder="email@example.com" required>

        <label for="password">ตั้งรหัสผ่าน</label>
        <input type="password" id="password" name="password" placeholder="อย่างน้อย 8 ตัวอักษร" required minlength="8">

        <label for="confirm-password">ยืนยันรหัสผ่าน</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="ยืนยันรหัสผ่านอีกครั้ง" required minlength="8">

        <button type="submit" class="btn-submit">เสร็จสิ้น</button>
    </form>
</main>

<script type="module">
import { register } from "./auth.js";

document.querySelector("form").addEventListener("submit", function (e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;

    register(email, pass)
        .then(() => {
            alert("สมัครสมาชิกสำเร็จ");
            window.location.href = "login.html";
        })
        .catch(err => alert(err.message));
});
</script>

</body>
</html>
